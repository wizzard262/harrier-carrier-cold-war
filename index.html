<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="utf-8">
		<title>Play Harrier Carrier</title>
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="keywords" content="Harrier Carrier, Cold War, strategy, puzzle, tower defense, HTML5 game, Phaser"/>
        <meta name="description" content="Play Harrier Carrier in your browser: a Cold War strategy puzzle tower defense game." />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<link rel="shortcut icon" href="assets/ico.ico">
		<meta name="viewport" content="user-scalable=0, initial-scale=1, minimum-scale=1, maximum-scale=1, width=device-width, minimal-ui=1">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<style type="text/css">
			body {
				margin: 0px 0px 1px 0px; /* the extra 1px allows the iOS inner/outer check to work */
				font-family: Arial;
				font-size: 30px;
                background-color: #000000;
                height: 100%;
			}

			/*
			 * Phones taller than the game (it is 700 x 900, so narrower than 7:9):
			 * the game sits at the bottom of the screen, nearest the thumbs, and extra sky fills the space above it.
			 * The game fills the width here, so 100vw is 700 game pixels and 1 cloud strip is 100 game pixels (14.286vw).
			 */
			@media (max-aspect-ratio: 7/9) {
				html, body {
					height: 100%;
					overflow: hidden; /* never a page to scroll, whatever size the browser bars leave */
				}
				body {
					margin: 0;
					display: flex;
					flex-direction: column;
					justify-content: flex-end; /* the canvas goes to the bottom */
					align-items: flex-start;   /* the canvas keeps the width the game gives it */
					background-color: #B8E7FF; /* the sky colour at the top of the game, so no join shows */
					background-image: url(assets/cloud_1.png), url(assets/cloud_1.png), url(assets/cloud_1.png);
					background-repeat: no-repeat;
					background-size: 143.4vw 14.286vw; /* same stretch as the clouds in the game */
					background-position:
						-60vw  calc(100% - 128.6vw - 4vw),   /* just above the game */
						-5vw   calc(100% - 128.6vw - 30vw),  /* higher up */
						-80vw  calc(100% - 128.6vw - 60vw);  /* near the top */
					image-rendering: pixelated;
				}
			}
		</style>

		<!-- libraries -->
		<script src="lib/phaser.min.js"></script>                  <!-- Phaser 2.6.2 -->
		<script src="lib/phaser-plugin-isometric.min.js"></script> <!-- Phaser Isometric 0.9.4 -->
		<script src="lib/pathfinding-browser.min.js"></script>     <!-- PathFinding.js -->
		<script src="lib/howler.core.min.js"></script>             <!-- howler.js 2.2.4 -->

		<!-- the game: order matters, main.js last -->
		<script src="js/config.js"></script>
		<script src="js/levels.js"></script>
		<script src="js/state.js"></script>
		<script src="js/audio.js"></script>
		<script src="js/aircraft.js"></script>
		<script src="js/draw.js"></script>
		<script src="js/deck.js"></script>
		<script src="js/stack.js"></script>
		<script src="js/waves.js"></script>
		<script src="js/menu.js"></script>
		<script src="js/tutorial.js"></script>
		<script src="js/main.js"></script>
</head>
<body></body>
</html>
